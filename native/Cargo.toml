[package]
name = "rapid_crypto"
version = "0.1.1"
edition = "2024"
description = "Rust core for the rapid_crypto Dart package: MD5, SHA-1, SHA-2 and HMAC."
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# RustCrypto 0.11 detects the CPU's SHA-1/SHA-256 (ARMv8 "sha2", x86 SHA-NI)
# and SHA-512 (ARMv8.2 "sha3") instructions at runtime and uses them when
# present, with a software fallback. No assembler is needed, which keeps
# cross-compiling simple. (The 0.10 releases only use the ARM SHA-256 path
# with the `asm` feature and have no ARM SHA-1 path.)
[dependencies]
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
