name: rapid_crypto
description: >-
  package:crypto, faster: a drop-in import that computes MD5, SHA-1, SHA-2
  and HMAC in Rust, using the CPU's SHA instructions when available.
version: 0.1.0
repository: https://github.com/vishaaalls/rapid_crypto
topics: [crypto, hash, sha256, hmac, performance]

environment:
  sdk: ^3.6.0

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.0
  hooks: ^2.2.0

dev_dependencies:
  convert: ^3.1.0
  test: ^1.25.0

# When this package is the root (its own tests, benchmarks), build the Rust
# code in this checkout instead of downloading a release binary.
hooks:
  user_defines:
    rapid_crypto:
      from_source: true
